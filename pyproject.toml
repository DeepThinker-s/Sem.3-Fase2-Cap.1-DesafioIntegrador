[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cardioai-fase2"
version = "0.1.0"
description = "Simulação educacional de triagem cardiovascular por regras e classificação de texto"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<4",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
  "nbconvert>=7.16,<8",
  "ipykernel>=6.29,<8",
  "pytest>=8.0,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
